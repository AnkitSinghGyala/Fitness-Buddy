<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Set a new Fitness Buddy password" />
  <title>Reset password · Fitness Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Fitness Buddy home">
        <span class="brand-mark" aria-hidden="true">💪</span>
        Fitness Buddy
      </a>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section container auth-section" aria-label="Reset password">
      <header class="section-head auth-head">
        <p class="section-kicker">Account</p>
        <h2 class="section-title">Reset password</h2>
        <p class="section-desc">Choose a new password for your account.</p>
      </header>

      <div class="auth-layout">
        <div class="card auth-card">
          <form id="reset-form" novalidate>
            <input type="hidden" id="token" name="token" />

            <div class="auth-grid">
              <div class="auth-field">
                <label for="new-password">New password</label>
                <div class="auth-pass">
                  <input id="new-password" name="newPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6" />
                  <button type="button" class="auth-pass-toggle" id="toggle-new-password" aria-pressed="false" aria-label="Show new password">Show</button>
                </div>
                <div class="auth-hints" aria-live="polite">
                  <div class="auth-meter" aria-hidden="true"><span id="strength-bar"></span></div>
                  <div class="auth-hint-row">
                    <span id="strength-label" class="auth-strength is-weak">Weak</span>
                    <span class="auth-hint-text" id="strength-text">Use 8+ chars, with a number and a symbol.</span>
                  </div>
                </div>
              </div>

              <div class="auth-field">
                <label for="confirm-password">Confirm new password</label>
                <div class="auth-pass">
                  <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-type your password" required minlength="6" />
                  <button type="button" class="auth-pass-toggle" id="toggle-confirm-password" aria-pressed="false" aria-label="Show confirm password">Show</button>
                </div>
                <p class="auth-inline-error" id="confirm-error" role="status" aria-live="polite"></p>
              </div>
            </div>

            <div class="button-group">
              <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Update password</button>
            </div>

            <p class="auth-error" id="error" role="status" aria-live="polite"></p>
            <p class="section-desc" id="success" style="display:none; margin-top: 1rem;">
              Password updated. You can now <a href="login.html">log in</a>.
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function setError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.textContent = msg || "";
      el.style.display = msg ? "block" : "none";
    }

    function setConfirmError(msg) {
      const el = document.getElementById("confirm-error");
      if (!el) return;
      el.textContent = msg || "";
      el.style.display = msg ? "block" : "none";
    }

    function scorePassword(pw) {
      const s = String(pw || "");
      let score = 0;
      if (s.length >= 6) score += 1;
      if (s.length >= 10) score += 1;
      if (/[A-Z]/.test(s)) score += 1;
      if (/[0-9]/.test(s)) score += 1;
      if (/[^A-Za-z0-9]/.test(s)) score += 1;
      return score;
    }

    function updateStrengthUI() {
      const input = document.getElementById("new-password");
      const bar = document.getElementById("strength-bar");
      const label = document.getElementById("strength-label");
      const text = document.getElementById("strength-text");
      if (!input || !bar || !label || !text) return;

      const score = scorePassword(input.value);
      const pct = Math.min(100, Math.round((score / 5) * 100));
      bar.style.width = pct + "%";

      label.classList.remove("is-weak", "is-ok", "is-strong");
      if (score <= 2) {
        label.textContent = "Weak";
        label.classList.add("is-weak");
        text.textContent = "Use 8+ chars, with a number and a symbol.";
      } else if (score <= 4) {
        label.textContent = "Okay";
        label.classList.add("is-ok");
        text.textContent = "Nice—add length or mix symbols/uppercase.";
      } else {
        label.textContent = "Strong";
        label.classList.add("is-strong");
        text.textContent = "Great—this looks strong.";
      }
    }

    function wireToggle(inputId, btnId, labelShow, labelHide) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!input || !btn) return;
      btn.addEventListener("click", function () {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? labelShow : labelHide;
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
        input.focus();
      });
    }

    function validateMatch() {
      const pw = String(document.getElementById("new-password")?.value || "");
      const cpw = String(document.getElementById("confirm-password")?.value || "");
      if (!cpw) {
        setConfirmError("");
        return true;
      }
      if (pw !== cpw) {
        setConfirmError("Passwords do not match.");
        return false;
      }
      setConfirmError("");
      return true;
    }

    async function onSubmit(ev) {
      ev.preventDefault();
      setError("");
      if (!validateMatch()) return;

      const token = String(document.getElementById("token")?.value || "");
      const newPassword = String(document.getElementById("new-password")?.value || "");
      const confirmPassword = String(document.getElementById("confirm-password")?.value || "");
      if (newPassword !== confirmPassword) {
        setConfirmError("Passwords do not match.");
        return;
      }

      const btn = document.getElementById("submit-btn");
      if (btn) btn.disabled = true;

      try {
        const r = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          setError(data?.error || `Reset failed (HTTP ${r.status}).`);
          return;
        }
        document.getElementById("success").style.display = "block";
      } catch (_) {
        setError("Network error. Is the server running?");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    window.addEventListener("DOMContentLoaded", function () {
      const token = qs("token");
      document.getElementById("token").value = token || "";
      if (!token) setError("Missing token. Use the link from the forgot password page.");

      wireToggle("new-password", "toggle-new-password", "Show", "Hide");
      wireToggle("confirm-password", "toggle-confirm-password", "Show", "Hide");
      document.getElementById("new-password")?.addEventListener("input", updateStrengthUI);
      document.getElementById("new-password")?.addEventListener("input", validateMatch);
      document.getElementById("confirm-password")?.addEventListener("input", validateMatch);
      updateStrengthUI();
      document.getElementById("reset-form")?.addEventListener("submit", onSubmit);
    });
  </script>
</body>
</html>
