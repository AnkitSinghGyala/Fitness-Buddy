<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a Fitness Buddy account" />
  <title>Register · Fitness Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Fitness Buddy home">
        <span class="brand-mark" aria-hidden="true">💪</span>
        Fitness Buddy
      </a>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section container auth-section" aria-label="Register">
      <header class="section-head auth-head">
        <p class="section-kicker">Get started</p>
        <h2 class="section-title">Create your account</h2>
      </header>

      <div class="auth-layout">
        <div class="card auth-card">
          <form id="register-form" novalidate>
            <div class="auth-grid">
              <div class="auth-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
              </div>
              <div class="auth-field">
                <label for="password">Password</label>
                <div class="auth-pass">
                  <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6" />
                  <button type="button" class="auth-pass-toggle" id="toggle-password" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
                <div class="auth-hints" id="password-hints" aria-live="polite">
                  <div class="auth-meter" aria-hidden="true"><span id="strength-bar"></span></div>
                  <div class="auth-hint-row">
                    <span id="strength-label" class="auth-strength is-weak">Weak</span>
                    <span class="auth-hint-text" id="strength-text">Use 8+ chars, with a number and a symbol.</span>
                  </div>
                </div>
              </div>
              <div class="auth-field">
                <label for="confirm-password">Confirm password</label>
                <div class="auth-pass">
                  <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-type your password" required minlength="6" />
                  <button type="button" class="auth-pass-toggle" id="toggle-confirm-password" aria-pressed="false" aria-label="Show confirm password">Show</button>
                </div>
                <p class="auth-inline-error" id="confirm-error" role="status" aria-live="polite"></p>
              </div>
            </div>
            <div class="button-group">
              <button type="submit" class="btn btn-primary btn-block" id="register-btn">Register</button>
            </div>
            <p class="auth-error" id="error" role="status" aria-live="polite"></p>
            <p class="section-desc" style="margin-top: 1rem;">
              Already have an account? <a href="login.html">Login</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    function scorePassword(pw) {
      const s = String(pw || "");
      let score = 0;
      if (s.length >= 6) score += 1;
      if (s.length >= 10) score += 1;
      if (/[A-Z]/.test(s)) score += 1;
      if (/[0-9]/.test(s)) score += 1;
      if (/[^A-Za-z0-9]/.test(s)) score += 1;
      return score; // 0..5
    }

    function updateStrengthUI() {
      const input = document.getElementById("password");
      const bar = document.getElementById("strength-bar");
      const label = document.getElementById("strength-label");
      const text = document.getElementById("strength-text");
      if (!input || !bar || !label || !text) return;

      const score = scorePassword(input.value);
      const pct = Math.min(100, Math.round((score / 5) * 100));
      bar.style.width = pct + "%";

      label.classList.remove("is-weak", "is-ok", "is-strong");
      if (score <= 2) {
        label.textContent = "Weak";
        label.classList.add("is-weak");
        text.textContent = "Use 8+ chars, with a number and a symbol.";
      } else if (score <= 4) {
        label.textContent = "Okay";
        label.classList.add("is-ok");
        text.textContent = "Nice—add length or mix symbols/uppercase.";
      } else {
        label.textContent = "Strong";
        label.classList.add("is-strong");
        text.textContent = "Great—this looks strong.";
      }
    }

    function wireShowPassword() {
      const input = document.getElementById("password");
      const btn = document.getElementById("toggle-password");
      if (!input || !btn) return;
      btn.addEventListener("click", function () {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
        btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
        input.focus();
      });
    }

    function wireShowConfirmPassword() {
      const input = document.getElementById("confirm-password");
      const btn = document.getElementById("toggle-confirm-password");
      if (!input || !btn) return;
      btn.addEventListener("click", function () {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
        btn.setAttribute("aria-label", showing ? "Show confirm password" : "Hide confirm password");
        input.focus();
      });
    }

    function setConfirmError(msg) {
      const el = document.getElementById("confirm-error");
      if (!el) return;
      el.textContent = msg || "";
      el.style.display = msg ? "block" : "none";
    }

    function validateMatch() {
      const pw = String(document.getElementById("password")?.value || "");
      const cpw = String(document.getElementById("confirm-password")?.value || "");
      if (!cpw) {
        setConfirmError("");
        return true;
      }
      if (pw !== cpw) {
        setConfirmError("Passwords do not match.");
        return false;
      }
      setConfirmError("");
      return true;
    }

    function setError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.textContent = msg || "";
      el.style.display = msg ? "block" : "none";
    }

    async function onSubmit(ev) {
      ev.preventDefault();
      setError("");
      if (!validateMatch()) return;

      const email = String(document.getElementById("email")?.value || "").trim();
      const password = String(document.getElementById("password")?.value || "");
      const confirmPassword = String(document.getElementById("confirm-password")?.value || "");
      if (password !== confirmPassword) {
        setConfirmError("Passwords do not match.");
        return;
      }
      const btn = document.getElementById("register-btn");
      if (btn) btn.disabled = true;

      try {
        const r = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          const msg = data?.error || `Registration failed (HTTP ${r.status}).`;
          setError(msg);
          return;
        }
        window.location.href = "/";
      } catch (e) {
        setError("Network error. Is the server running?");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById("register-form")?.addEventListener("submit", onSubmit);
    window.addEventListener("DOMContentLoaded", function () {
      wireShowPassword();
      wireShowConfirmPassword();
      document.getElementById("password")?.addEventListener("input", updateStrengthUI);
      document.getElementById("password")?.addEventListener("input", validateMatch);
      document.getElementById("confirm-password")?.addEventListener("input", validateMatch);
      updateStrengthUI();
    });
  </script>
</body>
</html>
