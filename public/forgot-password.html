<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your Fitness Buddy password" />
  <title>Forgot password · Fitness Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Fitness Buddy home">
        <span class="brand-mark" aria-hidden="true">💪</span>
        Fitness Buddy
      </a>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section container auth-section" aria-label="Forgot password">
      <header class="section-head auth-head">
        <p class="section-kicker">Account</p>
        <h2 class="section-title">Forgot your password?</h2>
        <p class="section-desc">Enter your email. In this project we’ll show a reset link (no paid email service needed).</p>
      </header>

      <div class="auth-layout">
        <div class="card auth-card">
          <form id="forgot-form" novalidate>
            <div class="auth-grid">
              <div class="auth-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
              </div>
            </div>
            <div class="button-group">
              <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
            </div>
            <p class="auth-error" id="error" role="status" aria-live="polite"></p>
            <div class="card" id="result-card" style="display:none; margin-top: 1rem;">
              <h3 class="card-title" style="margin-bottom: 0.5rem;">Reset link</h3>
              <p class="section-desc" style="margin-bottom: 0.75rem;">Open this link to set a new password:</p>
              <a class="btn btn-secondary btn-block" id="reset-link" href="#">Open reset page</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    function setError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.textContent = msg || "";
      el.style.display = msg ? "block" : "none";
    }

    function showResetLink(href) {
      const card = document.getElementById("result-card");
      const a = document.getElementById("reset-link");
      if (!card || !a) return;
      a.href = href;
      card.style.display = "block";
    }

    async function onSubmit(ev) {
      ev.preventDefault();
      setError("");
      const email = String(document.getElementById("email")?.value || "").trim();
      const btn = document.getElementById("submit-btn");
      if (btn) btn.disabled = true;

      try {
        const r = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          setError(data?.error || `Request failed (HTTP ${r.status}).`);
          return;
        }
        if (data?.resetLink) showResetLink(data.resetLink);
      } catch (_) {
        setError("Network error. Is the server running?");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById("forgot-form")?.addEventListener("submit", onSubmit);
  </script>
</body>
</html>
